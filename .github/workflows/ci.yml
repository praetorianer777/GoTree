# The PR gate. It holds nothing but run-tests.sh on purpose: whatever gates a
# push locally through the branch-guard hook is exactly what gates it here, so
# the two can never drift apart.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "11 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: ${{ hashFiles('go.sum') != '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: ./run-tests.sh
